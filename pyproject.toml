[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biletall-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for biletall.com bus & flight tickets (routes, journeys, prices, popular routes)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
biletall-mcp = "biletall_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biletall_mcp"]
